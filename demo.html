<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DocMind Demo</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: #f4f8fe;
            color: #111a3d;
            font-size: 13px
        }

        button,
        input {
            font: inherit
        }

        button {
            cursor: pointer
        }

        .nav {
            height: 66px;
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 18px
        }

        .brand {
            width: 330px;
            display: flex;
            align-items: center;
            gap: 12px
        }

        .logo {
            height: 40px;
            width: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #38bdf8, #2563eb, #8b5cf6);
            position: relative
        }

        .logo:after {
            content: '';
            position: absolute;
            left: 8px;
            top: 8px;
            width: 16px;
            height: 24px;
            background: white;
            border-radius: 8px 2px 2px 8px
        }

        .brand b {
            font-size: 20px
        }

        .brand small {
            display: block;
            color: #64748b
        }

        .navlinks {
            display: flex;
            gap: 4px;
            flex: 1
        }

        .navlinks button {
            border: 0;
            background: transparent;
            padding: 11px 15px;
            border-radius: 9px;
            color: #475569
        }

        .navlinks .active {
            background: #eaf2ff;
            color: #155eef
        }

        .right {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .quick {
            border: 1px solid #dbe4f0;
            background: #f8fafc;
            padding: 9px 12px;
            border-radius: 9px;
            color: #94a3b8
        }

        .avatar {
            height: 38px;
            width: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fde68a, #fb923c);
            display: grid;
            place-items: center;
            font-weight: 800
        }

        .layout {
            height: calc(100vh - 66px);
            display: grid;
            grid-template-columns: 348px minmax(0, 1fr);
            gap: 14px;
            padding: 14px 28px
        }

        .left,
        .main {
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .card {
            background: white;
            border: 1px solid #dce5f2;
            border-radius: 12px;
            box-shadow: 0 8px 30px #27499112
        }

        .upload {
            padding: 14px
        }

        .upload h2,
        .docs h2 {
            margin: 0 0 12px;
            font-size: 17px
        }

        .drop {
            height: 216px;
            border: 1px dashed #8eb4ff;
            border-radius: 9px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center
        }

        .cloud {
            font-size: 38px;
            color: #2563eb
        }

        .pills {
            display: flex;
            gap: 6px;
            margin: 12px 0
        }

        .pill {
            background: #edf2f8;
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 10px
        }

        .choose {
            border: 0;
            background: linear-gradient(90deg, #4f46e5, #2563eb);
            color: #fff;
            border-radius: 6px;
            padding: 10px;
            width: 270px
        }

        .docs {
            min-height: 0;
            flex: 1;
            padding: 14px;
            display: flex;
            flex-direction: column
        }

        .dochead {
            display: flex;
            justify-content: space-between
        }

        .searchdoc {
            display: flex;
            gap: 7px;
            margin-bottom: 8px
        }

        .searchdoc input {
            width: 100%;
            height: 36px;
            border: 1px solid #dbe4f0;
            border-radius: 8px;
            padding: 0 10px;
            outline: 0
        }

        .filter {
            width: 38px;
            border: 1px solid #dbe4f0;
            background: #fff;
            border-radius: 8px
        }

        .list {
            overflow: auto;
            min-height: 0
        }

        .row {
            min-height: 61px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #edf1f6;
            padding: 8px;
            position: relative
        }

        .row.selected {
            background: #edf4ff;
            border-radius: 7px
        }

        .row.selected:before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #2563eb;
            border-radius: 4px
        }

        .fi {
            width: 35px;
            height: 35px;
            border-radius: 5px;
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 9px;
            font-weight: 800;
            flex: none
        }

        .pdf {
            background: #ef262b
        }

        .docx {
            background: #1e78d7
        }

        .txt {
            background: #8793a6
        }

        .info {
            min-width: 0;
            flex: 1
        }

        .name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .meta {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px
        }

        .status {
            font-size: 11px;
            color: #2563eb;
            margin-top: 4px
        }

        .failed {
            color: #ef4444
        }

        .more {
            border: 0;
            background: transparent;
            font-size: 20px
        }

        .total {
            padding: 13px 15px;
            display: flex;
            align-items: center;
            gap: 12px
        }

        .total .icon {
            width: 40px;
            height: 40px;
            background: #edf4ff;
            color: #4f46e5;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 20px
        }

        .total b {
            color: #155eef;
            font-size: 16px
        }

        .searchcard {
            position: relative;
            padding: 14px
        }

        .searchbar {
            display: flex;
            gap: 7px
        }

        .searchbar input {
            flex: 1;
            height: 44px;
            border: 1px solid #4b8dff;
            border-radius: 9px;
            padding: 0 14px;
            font-size: 16px;
            outline: 0
        }

        .searchbtn {
            width: 112px;
            border: 0;
            border-radius: 9px;
            background: linear-gradient(90deg, #4f46e5, #2563eb);
            color: #fff;
            font-weight: 700
        }

        .dropdown {
            position: absolute;
            left: 14px;
            right: 14px;
            top: 70px;
            z-index: 20;
            background: #fff;
            border: 1px solid #dce5f2;
            border-radius: 12px;
            box-shadow: 0 18px 50px #27499122;
            display: flex;
            max-height: 270px;
            overflow: hidden
        }

        .cats {
            width: 220px;
            border-right: 1px solid #edf1f6;
            padding: 8px
        }

        .cats button {
            width: 100%;
            border: 0;
            background: transparent;
            text-align: left;
            padding: 11px;
            border-radius: 8px;
            color: #334155
        }

        .cats .sel {
            background: #edf4ff;
            color: #155eef
        }

        .resultlist {
            flex: 1;
            overflow: auto;
            padding: 0 10px
        }

        .result {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 12px 4px;
            border-bottom: 1px solid #edf1f6
        }

        .snippet {
            flex: 1;
            min-width: 0
        }

        .snippet b {
            color: #155eef;
            background: #dbeafe
        }

        .match {
            padding: 6px 9px;
            border-radius: 7px;
            background: #e6f7f1;
            color: #047857;
            font-size: 10px
        }

        .viewer {
            min-height: 0;
            flex: 1;
            overflow: hidden
        }

        .vhead {
            height: 68px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            border-bottom: 1px solid #edf1f6
        }

        .vactions {
            margin-left: auto;
            display: flex;
            gap: 8px
        }

        .action {
            border: 1px solid #dbe4f0;
            background: #fff;
            padding: 9px 14px;
            border-radius: 8px
        }

        .ai {
            background: linear-gradient(90deg, #8b5cf6, #2563eb);
            color: #fff;
            border: 0
        }

        .tabs {
            height: 40px;
            display: flex;
            gap: 28px;
            align-items: end;
            padding: 0 14px;
            border-bottom: 1px solid #edf1f6
        }

        .tabs button {
            border: 0;
            background: transparent;
            height: 40px;
            color: #64748b
        }

        .tabs .active {
            color: #155eef;
            border-bottom: 2px solid #155eef
        }

        .toolbar {
            height: 44px;
            border-bottom: 1px solid #edf1f6;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 14px
        }

        .tool {
            border: 0;
            background: transparent
        }

        .find {
            margin-left: auto;
            border: 1px solid #dbe4f0;
            border-radius: 7px;
            height: 31px;
            padding: 0 9px;
            color: #64748b
        }

        .body {
            min-height: 0;
            display: flex;
            height: calc(100% - 152px)
        }

        .thumbs {
            width: 118px;
            background: #f8fafc;
            padding: 10px;
            overflow: auto
        }

        .thumb {
            height: 72px;
            width: 72px;
            background: #fff;
            border: 1px solid #dbe4f0;
            margin: 0 auto 10px;
            border-radius: 4px;
            padding: 7px
        }

        .thumb div {
            height: 100%;
            background: linear-gradient(#d8dee8 10%, transparent 10% 18%, #d8dee8 18% 20%, transparent 20% 30%, #d8dee8 30% 33%, transparent 33% 42%, #d8dee8 42% 44%, transparent 44% 55%, #d8dee8 55% 58%, transparent 58%)
        }

        .thumb.sel {
            border: 2px solid #2563eb
        }

        .paperwrap {
            flex: 1;
            background: #f1f5f9;
            padding: 20px;
            overflow: auto
        }

        .paper {
            background: #fff;
            max-width: 820px;
            min-height: 600px;
            margin: auto;
            padding: 70px 110px;
            box-shadow: 0 2px 12px #0f172a10
        }

        .paper h1 {
            font-size: 24px
        }

        .paper p,
        .paper li {
            font-size: 14px;
            line-height: 1.7
        }

        .paper mark {
            background: #fde68a
        }

        .tip {
            margin-top: 28px;
            border: 1px solid #93c5fd;
            background: #eff6ff;
            padding: 16px;
            border-radius: 7px;
            color: #31558c
        }

        .empty {
            height: 100%;
            display: grid;
            place-items: center;
            text-align: center
        }

        .emptybox {
            max-width: 440px
        }

        .emptyicon {
            font-size: 48px
        }

        .empty p {
            color: #64748b;
            line-height: 1.7
        }

        .empty .tip {
            font-size: 12px;
            text-align: left
        }

        .menu {
            position: absolute;
            right: 10px;
            top: 50px;
            background: #fff;
            border: 1px solid #dbe4f0;
            border-radius: 8px;
            box-shadow: 0 12px 30px #0f172a22;
            padding: 5px;
            width: 150px;
            z-index: 50
        }

        .menu button {
            display: block;
            width: 100%;
            border: 0;
            background: transparent;
            text-align: left;
            padding: 9px;
            border-radius: 5px
        }

        .menu button:hover {
            background: #f1f5f9
        }

        .menu .red {
            color: #ef4444
        }
    </style>
</head>

<body>
    <header class="nav">
        <div class="brand">
            <div class="logo"></div>
            <div><b>DocMind</b><small>Your knowledge, instantly.</small></div>
        </div>
        <nav class="navlinks"><button class="active">⌂ &nbsp; Dashboard</button><button>▱ &nbsp;
                Documents</button><button>⌕ &nbsp; Search</button><button>▥ &nbsp; Analytics</button><button>⚙ &nbsp;
                Settings</button></nav>
        <div class="right">
            <div class="quick">⌕ &nbsp; Search anything... &nbsp; ⌘ K</div>
            <div>♧</div>
            <div class="avatar">RK</div>
            <div><b>Rahul Kumar</b><small style="display:block;color:#64748b">Free Plan</small></div><span>⌄</span>
        </div>
    </header>
    <main class="layout">
        <aside class="left">
            <section class="card upload">
                <h2>Upload Documents</h2>
                <div class="drop">
                    <div class="cloud">☁</div>
                    <div>Drag & drop your files here<br>or click to browse</div>
                    <div class="pills"><span class="pill">PDF</span><span class="pill">DOC</span><span
                            class="pill">DOCX</span><span class="pill">TXT</span><span class="pill">PPT</span><span
                            class="pill">XLS</span></div><button class="choose"
                        onclick="document.getElementById('file').click()">⌑ &nbsp; Choose Files</button><input id="file"
                        type="file" multiple hidden onchange="upload(this.files)"><small
                        style="margin-top:8px;color:#64748b">Max file size 50MB</small>
                </div>
            </section>
            <section class="card docs">
                <div class="dochead">
                    <h2>Your Documents <span style="font-weight:500;color:#64748b">(42)</span></h2><span>⌃</span>
                </div>
                <div class="searchdoc"><input placeholder="Search your documents..."
                        oninput="filterDocs(this.value)"><button class="filter">⚱</button></div>
                <div class="list" id="list"></div>
            </section>
            <section class="card total">
                <div class="icon">▣</div>
                <div>
                    <div style="color:#64748b">Total Uploaded Documents</div><b>42 files &nbsp;•&nbsp; 128.6 MB</b>
                </div>
            </section>
        </aside>
        <section class="main">
            <section class="card searchcard">
                <div class="searchbar"><input id="q" value="machine learning" oninput="search(this.value)"
                        onfocus="showSearch()"><button class="searchbtn">Search</button></div>
                <div id="drop" class="dropdown"></div>
            </section>
            <section class="card viewer" id="viewer"></section>
        </section>
    </main>
    <script>
        const docs = [['Product_Requirements.pdf', 'pdf', '2.4 MB', 'Aug 28, 2024', 'done'], ['Technical_Design.docx', 'docx', '1.8 MB', 'Aug 26, 2024', 'done'], ['Meeting_Notes.txt', 'txt', '320 KB', 'Aug 24, 2024', 'done'], ['AI_Research_Paper.pdf', 'pdf', '', '', 'upload'], ['Q3_Financial_Report.pdf', 'pdf', '', '', 'processing'], ['User_Guide.pdf', 'pdf', '4.1 MB', 'Aug 20, 2024', 'done'], ['Project_Timeline.pdf', 'pdf', '', '', 'failed'], ['Architecture_Diagram.pdf', 'pdf', '3.6 MB', 'Aug 15, 2024', 'done'], ['Interview_Prep_Notes.txt', 'txt', '280 KB', 'Aug 12, 2024', 'done'], ['Project_Timeline_v2.pdf', 'pdf', '1.7 MB', 'Aug 10, 2024', 'done'], ['Security_Architecture.docx', 'docx', '2.1 MB', 'Aug 08, 2024', 'done'], ['Customer_Research.txt', 'txt', '410 KB', 'Aug 05, 2024', 'done'], ['API_Reference.pdf', 'pdf', '6.2 MB', 'Aug 02, 2024', 'done']];
        const results = [['Product_Requirements.pdf', 'pdf', 12, 92, 'Machine learning models can significantly improve accuracy and help in extracting...'], ['Technical_Design.docx', 'docx', 8, 87, 'We use machine learning to classify documents and extract structured information...'], ['Q3_Financial_Report.pdf', 'pdf', 24, 78, 'The future scope includes deep learning and machine learning for better predictions...'], ['Meeting_Notes.txt', 'txt', 3, 71, '... challenges in machine learning include data quality, training costs, and model...']]; let selected = 0;
        function icon(t) { return `<div class="fi ${t}">${t === 'pdf' ? 'PDF' : t === 'docx' ? 'W' : '≡'}</div>` }
        function renderList() { document.getElementById('list').innerHTML = docs.map((d, i) => `<div class="row ${selected === i ? 'selected' : ''}" onclick="openDoc(${i})">${icon(d[1])}<div class="info"><div class="name">${d[0]}</div>${d[4] === 'upload' ? '<div class="status">Uploading... &nbsp; 68%</div><div style="height:2px;background:#dbe4f0;width:105px;margin-top:5px"><div style="height:100%;width:68%;background:#2563eb"></div></div>' : d[4] === 'processing' ? '<div class="status">Processing...</div>' : d[4] === 'failed' ? '<div class="meta failed">Upload failed &nbsp;•&nbsp; <b>Retry</b></div>' : `<div class="meta">${d[2]} &nbsp;•&nbsp; ${d[3]}</div>`}</div>${d[4] === 'done' ? '<button class="more" onclick="event.stopPropagation();toggleMenu(event,' + i + ')">⋮</button>' : d[4] === 'failed' ? '<span style="color:#ef4444">⊗</span>' : '<span style="color:#2563eb;font-size:18px">◯</span>'}</div>`).join('') }
        function filterDocs(q) { document.querySelectorAll('.row').forEach((r) => r.style.display = r.innerText.toLowerCase().includes(q.toLowerCase()) ? 'flex' : 'none') }
        function search(q) { if (q.length < 3) { document.getElementById('drop').style.display = 'none'; return } showSearch(); const html = `<aside class="cats"><button class="sel">⌕ &nbsp; All Results <span style="float:right">12</span></button><button>▱ &nbsp; Documents <span style="float:right">8</span></button><button>▣ &nbsp; Pages <span style="float:right">3</span></button><button>☰ &nbsp; Headings <span style="float:right">5</span></button></aside><div class="resultlist">${results.map((r, i) => `<div class="result" onclick="openDoc(${i === 1 ? 1 : i === 2 ? 4 : i === 3 ? 2 : 0},${r[2]})">${icon(r[1])}<div class="snippet"><div>${r[4].replace(/machine learning/ig, '<b>machine learning</b>')}</div><small style="color:#64748b">${r[0]} &nbsp;•&nbsp; Page ${r[2]}</small></div><span class="match" style="${r[3] < 85 ? 'background:#fff3d7;color:#a16207' : ''}">${r[3]}% match</span></div>`).join('')}</div>`; document.getElementById('drop').innerHTML = html }
        function showSearch() { if (document.getElementById('q').value.length >= 3) { document.getElementById('drop').style.display = 'flex'; search(document.getElementById('q').value) } }
        function openDoc(i, page) { selected = i; renderList(); const d = docs[i]; document.getElementById('viewer').innerHTML = `<div class="vhead">${icon(d[1])}<div style="margin-left:10px"><b style="font-size:16px">${d[0]}</b><div style="font-size:11px;color:#64748b">${d[2] || '2.4 MB'} • ${d[1] === 'pdf' ? 42 : 1} pages • ${d[3] || 'Today'}</div></div><div class="vactions"><button class="action ai">✦ Ask AI</button><button class="action">⇩ Download</button><button class="action">🔗 Share</button><button class="action" onclick="toggleViewerMenu()">⋮</button></div></div><div class="tabs"><button class="active">Viewer</button><button>♧ Summary</button><button>♧ Key Insights</button><button>☷ Related Content</button></div><div class="toolbar"><button class="tool">‹</button><b>${page || 12}</b><span>/ 42</span><button class="tool">›</button><span>|</span><button class="tool">−</button><b>100%</b><button class="tool">+</button><span>|</span><button class="tool">⛶</button><input class="find" value="machine learning"><span>⌃⌄</span><span>↻</span><span>◔</span><span>⛶</span></div><div class="body"><aside class="thumbs">${[10, 11, 12, 13, 14].map(p => `<div class="thumb ${p === (page || 12) ? 'sel' : ''}"><div></div><small style="display:block;text-align:center;margin-top:4px">${p}</small></div>`).join('')}</aside><div class="paperwrap">${d[1] === 'pdf' && d[0].startsWith('Product_Requirements') ? `<iframe src="mock-files/product-requirements.pdf#page=${page || 12}" style="width:100%;height:100%;min-height:600px;border:0;background:#fff"></iframe>` : `<div class="paper"><h1>3.2 &nbsp; AI Capabilities</h1><p><mark>Machine learning</mark> models can significantly improve accuracy and help in extracting meaningful insights from unstructured documents. The system should support multiple ML models and allow easy configuration.</p><h3>Key Requirements:</h3><ul><li>Support for multiple machine learning models</li><li>Ability to fine-tune models with user data</li><li>Scalable infrastructure for model inference</li><li>Provide confidence scores for extracted information</li></ul><div class="tip">ⓘ &nbsp; The system should be designed to be model-agnostic, allowing future integration of new <mark>machine learning</mark> models without major changes to the architecture.</div></div>`}</div></div>` }
        function upload(files) { if (!files.length) return; alert('Mock upload started for ' + files.length + ' file(s). The React app contains the full upload simulation.'); }
        function toggleMenu(e, i) { document.querySelectorAll('.menu').forEach(x => x.remove()); const m = document.createElement('div'); m.className = 'menu'; m.innerHTML = '<button>Open</button><button>Rename</button><button>Move to folder</button><button class="red">Delete</button>'; e.target.parentElement.parentElement.appendChild(m) }
        function toggleViewerMenu() { alert('Viewer menu: Open in new tab • Rename • Move to folder • Close document • Delete'); }
        renderList(); openDoc(0, 12); document.getElementById('drop').style.display = 'flex'; search('machine learning'); document.addEventListener('click', e => { if (!e.target.closest('.searchcard')) document.getElementById('drop').style.display = 'none' });
    </script>
</body>

</html>
